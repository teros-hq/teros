[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=info

; ── WAHA process ──
; La imagen devlikeapro/waha usa `node /app/index.js` como proceso principal.
; Si el ENTRYPOINT real de la imagen es diferente, ajusta `command` aquí.
[program:waha]
command=/waha-entrypoint.sh
directory=/app
; WAHA inherits env vars from the parent process (entrypoint.sh),
; so we only need to pass PORT here. WHATSAPP_API_KEY is picked up automatically.
; WAHA_SESSIONS_FOLDER points to /app-data which is bind-mounted from the user's
; workspace volume (workspaceHostPath/.apps/whatsapp) by the appDataMount mechanism.
environment=PORT=%(ENV_WAHA_PORT)s,WAHA_LOCAL_STORE_BASE_DIR=/app-data
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/waha.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/supervisor/waha-error.log
stderr_logfile_maxbytes=5MB
priority=10

; ── MCA Server process ──
; /start-mca.sh waits for WAHA /ping before launching the MCA server.
[program:mca-server]
command=/start-mca.sh
environment=RUNNER=%(ENV_RUNNER)s,ENTRY=%(ENV_ENTRY)s
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/mca.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/supervisor/mca-error.log
stderr_logfile_maxbytes=5MB
priority=20
