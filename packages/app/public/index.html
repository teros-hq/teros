      @font-face { font-family: "Prody"; src: url("/fonts/Prody-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
              /* Ivory Light (trial build: letters, digits and the apostrophe only; every other
                 glyph is a dot). The face is declared TWICE under the same family: first Prody
                 for the whole range, then Ivory restricted to its real glyphs — later unicode-range
                 faces win, so punctuation and accents fall through to Prody while the family name
                 stays a single "Ivory" (RenderHtml keeps only the first family of a list). */
              @font-face { font-family: "Ivory"; src: url("/fonts/Prody-Regular.otf") format("opentype"); font-weight: 300 400; font-style: normal; font-display: swap; }
              @font-face { font-family: "Ivory"; src: url("/fonts/Prody-Regular.otf") format("opentype"); font-weight: 300 400; font-style: italic; font-display: swap; }
              @font-face { font-family: "Ivory"; src: url("/fonts/Ivory-Light.otf") format("opentype"); font-weight: 300 400; font-style: normal; font-display: swap; unicode-range: U+20, U+2C-39, U+41-5A, U+61-7A, U+2019; }
              @font-face { font-family: "Ivory"; src: url("/fonts/Ivory-LightItalic.otf") format("opentype"); font-weight: 300 400; font-style: italic; font-display: swap; unicode-range: U+20, U+2C-39, U+41-5A, U+61-7A, U+2019; }

    <!-- Theme detection: read saved theme from localStorage before paint to avoid flash -->
    <script>
      (function() {
        var theme = 'dark';
        try {
          var raw = localStorage.getItem('teros-ui-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme === 'light') {
              theme = 'light';
            }
          }
        } catch (e) {}

        var root = document.documentElement;
        if (theme === 'light') {
          root.style.setProperty('--teros-loader-bg', '#F2F0F7');
          root.style.setProperty('--teros-loader-text', '#342F3D');
          root.style.setProperty('--teros-loader-text-secondary', '#797386');
          root.style.setProperty('--teros-loader-btn-text', '#F2F0F7');
          root.style.setProperty('--teros-loader-btn-bg', '#342F3D');
        } else {
          root.style.setProperty('--teros-loader-bg', '#201C27');
          root.style.setProperty('--teros-loader-text', '#FAF9FC');
          root.style.setProperty('--teros-loader-text-secondary', '#968FA7');
          root.style.setProperty('--teros-loader-btn-text', '#201C27');
          root.style.setProperty('--teros-loader-btn-bg', '#FAF9FC');
        }

        // Update meta theme-color to match
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', theme === 'light' ? '#F2F0F7' : '#201C27');
        }
      })();
    </script>

    <!-- App Shell / Loading Screen -->
    <style id="teros-app-shell">
      #teros-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--teros-loader-bg, #000000);
        color: var(--teros-loader-text, #ffffff);
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      #teros-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #teros-loading .shell-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
      }
      #teros-loading .shell-text {
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: var(--teros-loader-text-secondary, #a1a1aa);
        letter-spacing: 0.02em;
      }
      #teros-error {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
      }
      #teros-error .shell-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        opacity: 0.45;
      }
      #teros-error h1 {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--teros-loader-text, #ffffff);
      }
      #teros-error p {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: var(--teros-loader-text-secondary, #a1a1aa);
        margin: 0 0 24px;
        max-width: 320px;
        line-height: 1.5;
      }

        font-size: 14px;
        font-weight: 500;
        color: var(--teros-loader-btn-text, #000000);
        background: var(--teros-loader-btn-bg, #ffffff);
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

    <!-- Loading Watchdog -->
    <script>
      (function() {
        const MOUNT_TIMEOUT = 60000; // 60 segundos
        const CHECK_INTERVAL = 500;    // revisar cada 500ms

        const loadingEl = document.getElementById('teros-loading');
        const errorEl   = document.getElementById('teros-error');

        let elapsed = 0;
        let intervalId = null;

        function isAppMounted() {
          // React Native Web monta dentro de #root, reemplazando los hijos.
          // Si #root tiene un hijo que NO es teros-loading, React ya hidrató.
          const root = document.getElementById('root');
          if (!root) return false;

          const children = Array.from(root.children);
          // Si hay algún hijo distinto a teros-loading, React montó
          const hasReactContent = children.some(function(el) {
            return el.id !== 'teros-loading';
          });

          // También comprobamos clase de marca manual (fallback)
          const hasMountClass = document.body.classList.contains('app-mounted');

          return hasReactContent || hasMountClass;
        }

        function showError() {
          if (intervalId) clearInterval(intervalId);
          if (!loadingEl || !errorEl) return;

          // Ocultar spinner, mostrar error
          const spinner = document.getElementById('teros-shell-spinner');
          const text    = loadingEl.querySelector('.shell-text');
          if (spinner) spinner.style.display = 'none';
          if (text)    text.style.display = 'none';

          errorEl.style.display = 'flex';
        }

        function check() {
          if (isAppMounted()) {
            if (intervalId) clearInterval(intervalId);
            loadingEl.classList.add('hidden');
            return;
          }

          elapsed += CHECK_INTERVAL;
          if (elapsed >= MOUNT_TIMEOUT) {
            showError();
          }
        }

        // Iniciar watchdog
        intervalId = setInterval(check, CHECK_INTERVAL);

        // Comprobación inmediata por si el bundle ya cargó
        setTimeout(check, 100);
      })();
    </script>

    <!-- TerosLoading spinner (pure JS, no React) -->
    <script>
      (function() {
        var size  = 48;
        var color = '#5E6AD2';

        function buildPoints(s) {
          var padding   = s * 0.15;
          var innerSize = s - padding * 2;
          return [
            { x: s / 2,                               y: padding },
            { x: s - padding - innerSize * 0.067,     y: padding + innerSize * 0.25 },
            { x: s - padding - innerSize * 0.067,     y: padding + innerSize * 0.75 },
            { x: s / 2,                               y: s - padding },
            { x: padding + innerSize * 0.067,        y: padding + innerSize * 0.75 },
            { x: padding + innerSize * 0.067,        y: padding + innerSize * 0.25 },
          ];
        }

        function render(svgEl, activeIndex) {
          var points  = buildPoints(size);
          var baseR   = size * 0.08;
          var activeR = baseR * 1.2;
          svgEl.innerHTML = '';
          for (var i = 0; i < points.length; i++) {
            var dist    = Math.min(Math.abs(i - activeIndex), 6 - Math.abs(i - activeIndex));
            var opacity = dist === 0 ? 1 : dist === 1 ? 0.6 : 0.3;
            var r       = dist === 0 ? activeR : baseR;
            var circle  = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', points[i].x);
            circle.setAttribute('cy', points[i].y);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', color);
            circle.setAttribute('opacity', opacity);
            svgEl.appendChild(circle);
          }
        }

        // Animated spinner
        var svg = document.getElementById('teros-shell-spinner');
        if (svg) {
          var active = 0;
          render(svg, active);
          setInterval(function() {
            active = (active + 1) % 6;
            render(svg, active);
          }, 150);
        }

        // Static error logo (dimmed)
        var errorSvg = document.getElementById('teros-shell-error-logo');
        if (errorSvg) {
          render(errorSvg, -99); // activeIndex=-99 → all dots at dist≥2 → opacity 0.3
        }
      })();
    </script>
