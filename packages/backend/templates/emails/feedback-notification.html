<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>New Feedback Report — Teros</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #E4E4E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #E4E4E7;">
    <tr>
      <td align="center" style="padding: 40px 20px;">

        <!-- Card -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; background-color: #2D2D30; border-radius: 16px;">
          <tr>
            <td style="padding: 44px 40px;">

              <!-- Header -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="36" valign="middle">
                    <img src="{{STATIC_BASE_URL}}/logo.png" alt="Teros" width="32" height="32" style="display: block;" />
                  </td>
                  <td valign="middle" style="padding-left: 10px; font-size: 20px; font-weight: 600; color: #FAFAFA; letter-spacing: -0.02em;">Teros</td>
                  <td align="right" valign="middle" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #EF4444;">{{TYPE_LABEL}}</td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 36px;"></td></tr>
              </table>

              <!-- Title -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family: Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.3; color: #FAFAFA;">{{TITLE}}</td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 24px;"></td></tr>
              </table>

              <!-- Meta block -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: #1E1E22; border-radius: 12px;">
                <tr>
                  <td style="padding: 20px 24px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #71717A; padding-bottom: 16px;">Report Details</td>
                      </tr>
                      <tr>
                        <td style="padding-bottom: 10px;">
                          <span style="font-size: 12px; color: #A1A1AA;">Type:</span>
                          <span style="font-size: 13px; color: #FAFAFA; font-weight: 500;">{{TYPE}}</span>
                        </td>
                      </tr>
                      {{SEVERITY_ROW}}
                      <tr>
                        <td style="padding-bottom: 10px;">
                          <span style="font-size: 12px; color: #A1A1AA;">Reported by:</span>
                          <span style="font-size: 13px; color: #FAFAFA; font-weight: 500;">{{REPORTED_BY}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding-bottom: 10px;">
                          <span style="font-size: 12px; color: #A1A1AA;">Agent:</span>
                          <span style="font-size: 13px; color: #FAFAFA; font-weight: 500;">{{AGENT_ID}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding-bottom: 10px;">
                          <span style="font-size: 12px; color: #A1A1AA;">Owner:</span>
                          <span style="font-size: 13px; color: #FAFAFA; font-weight: 500;">{{OWNER_ID}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <span style="font-size: 12px; color: #A1A1AA;">Date:</span>
                          <span style="font-size: 13px; color: #FAFAFA; font-weight: 500;">{{DATE}}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 24px;"></td></tr>
              </table>

              <!-- Description -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #71717A; padding-bottom: 12px;">Description</td>
                </tr>
                <tr>
                  <td style="background-color: #1E1E22; border-radius: 12px; padding: 20px 24px;">
                    <div style="margin: 0; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; line-height: 1.6; color: #D4D4D8;">{{DESCRIPTION}}</div>
                  </td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 24px;"></td></tr>
              </table>

              <!-- Feedback ID -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="font-size: 11px; color: #52525B; text-align: center;">
                    Feedback ID: <code style="font-family: 'SF Mono', Monaco, monospace; background: #1E1E22; padding: 2px 6px; border-radius: 4px; color: #A1A1AA;">{{FEEDBACK_ID}}</code>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; margin-top: 20px;">
          <tr>
            <td style="font-size: 12px; color: #71717A; text-align: center;">
              This is an automated notification from Teros.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
