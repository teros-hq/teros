<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{SUBJECT}} — Teros</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #E4E4E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #E4E4E7;">
    <tr>
      <td align="center" style="padding: 40px 20px;">

        <!-- Card -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; background-color: #2D2D30; border-radius: 16px;">
          <tr>
            <td style="padding: 44px 40px;">

              <!-- Header -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="36" valign="middle">
                    <img src="{{STATIC_BASE_URL}}/logo.png" alt="Teros" width="32" height="32" style="display: block;" />
                  </td>
                  <td valign="middle" style="padding-left: 10px; font-size: 20px; font-weight: 600; color: #FAFAFA; letter-spacing: -0.02em;">Teros</td>
                  <td align="right" valign="middle" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #5E6AD2;">Notification</td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 36px;"></td></tr>
              </table>

              <!-- Title -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family: Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.3; color: #FAFAFA;">{{SUBJECT}}</td>
                </tr>
              </table>

              <!-- Agent badge -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 20px;"></td></tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size: 12px; color: #A1A1AA;">From: <span style="color: #FAFAFA; font-weight: 500;">{{AGENT_NAME}}</span> · <span style="color: #71717A;">{{TIMESTAMP}}</span></td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 28px;"></td></tr>
              </table>

              <!-- Content -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="background-color: #1E1E22; border-radius: 12px; padding: 24px;">
                    <div style="margin: 0; font-size: 14px; line-height: 1.7; color: #D4D4D8;">
                      {{CONTENT}}
                    </div>
                  </td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 32px;"></td></tr>
              </table>

              <!-- CTA -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td align="center">
                    <a href="{{APP_URL}}" style="display: inline-block; padding: 12px 32px; background-color: #5E6AD2; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 8px;">Open Teros</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; margin-top: 20px;">
          <tr>
            <td style="font-size: 12px; color: #71717A; text-align: center;">
              This is an automated notification from your Teros agent.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
