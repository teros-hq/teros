<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Your report is completed — Teros</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #E4E4E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #E4E4E7;">
    <tr>
      <td align="center" style="padding: 40px 20px;">

        <!-- Card -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; background-color: #2D2D30; border-radius: 16px;">
          <tr>
            <td style="padding: 44px 40px;">

              <!-- Header -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="36" valign="middle">
                    <img src="{{STATIC_BASE_URL}}/logo.png" alt="Teros" width="32" height="32" style="display: block;" />
                  </td>
                  <td valign="middle" style="padding-left: 10px; font-size: 20px; font-weight: 600; color: #FAFAFA; letter-spacing: -0.02em;">Teros</td>
                  <td align="right" valign="middle" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #10B981;">Completed</td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 36px;"></td></tr>
              </table>

              <!-- Title -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family: Georgia, serif; font-size: 24px; font-weight: 400; line-height: 1.35; color: #FAFAFA;">Good news — your report is completed.</td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 16px;"></td></tr>
              </table>

              <!-- Intro -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="font-size: 14px; line-height: 1.6; color: #A1A1AA;">
                    You reported the issue below, and the team has addressed it. Thank you for helping make Teros better.
                  </td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 24px;"></td></tr>
              </table>

              <!-- Report title block -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: #1E1E22; border-radius: 12px;">
                <tr>
                  <td style="padding: 20px 24px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #71717A; padding-bottom: 12px;">Your report</td>
                      </tr>
                      <tr>
                        <td style="font-size: 15px; font-weight: 600; color: #FAFAFA; line-height: 1.4;">{{TITLE}}</td>
                      </tr>
                      <tr>
                        <td style="padding-top: 12px; font-size: 12px; color: #A1A1AA;">Date: {{DATE}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 24px;"></td></tr>
              </table>

              <!-- Resolution note (conditional row is pre-rendered server-side; empty note collapses) -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #71717A; padding-bottom: 12px;">What we did</td>
                </tr>
                <tr>
                  <td style="background-color: #1E1E22; border-radius: 12px; padding: 20px 24px;">
                    <div style="margin: 0; font-size: 13px; line-height: 1.6; color: #D4D4D8;">{{RESOLUTION_NOTE}}</div>
                  </td>
                </tr>
              </table>

              <!-- Spacer -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 24px;"></td></tr>
              </table>

              <!-- Feedback ID -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="font-size: 11px; color: #52525B; text-align: center;">
                    Report ID: <code style="font-family: 'SF Mono', Monaco, monospace; background: #1E1E22; padding: 2px 6px; border-radius: 4px; color: #A1A1AA;">{{FEEDBACK_ID}}</code>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; margin-top: 20px;">
          <tr>
            <td style="font-size: 12px; color: #71717A; text-align: center;">
              This is an automated notification from Teros.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
