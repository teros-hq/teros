<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light only">
  <title>Your Teros verification code</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<!-- Palette and structure follow the app's access screens (AuthShell, light theme):
     page #F2F0F7, white card radius 24, text #342F3D / #575263 / #968FA7, accent #6F27FF. -->
<body style="margin: 0; padding: 0; background-color: #F2F0F7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F2F0F7;">
    <tr>
      <td align="center" style="padding: 48px 20px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 480px; width: 100%; background-color: #FFFFFF; border-radius: 24px;">
          <tr>
            <td style="padding: 40px 40px 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="32" valign="middle">
                    <img src="{{STATIC_BASE_URL}}/logo-violet.png" alt="" width="32" height="32" style="display: block;" />
                  </td>
                  <td valign="middle" style="padding-left: 8px; font-size: 20px; font-weight: 500; color: #342F3D; letter-spacing: -0.01em;">Teros</td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 32px; line-height: 32px; font-size: 0;">&nbsp;</td></tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family: Georgia, 'Times New Roman', serif; font-size: 32px; font-weight: 400; line-height: 36px; letter-spacing: -0.48px; color: #342F3D;">Confirm your email</td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 12px; line-height: 12px; font-size: 0;">&nbsp;</td></tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size: 15px; line-height: 22px; color: #575263;">Hi {{USER_NAME}}, enter this code in Teros to finish signing in.</td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 28px; line-height: 28px; font-size: 0;">&nbsp;</td></tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background-color: #F2F0F7; border: 1px solid #E5DFEF; border-radius: 14px; padding: 20px 12px 20px 23px; font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: 0.32em; color: #6F27FF;">{{CODE}}</td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 12px; line-height: 12px; font-size: 0;">&nbsp;</td></tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="font-size: 13px; line-height: 18px; color: #968FA7;">Expires in 10 minutes</td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height: 28px; line-height: 28px; font-size: 0; border-bottom: 1px solid #EDEAF4;">&nbsp;</td></tr>
                <tr><td style="height: 20px; line-height: 20px; font-size: 0;">&nbsp;</td></tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size: 13px; line-height: 20px; color: #575263;">If you didn't try to sign in to Teros, you can ignore this email. Nobody can get in without this code.</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width: 480px; width: 100%;">
          <tr><td style="height: 24px; line-height: 24px; font-size: 0;">&nbsp;</td></tr>
          <tr>
            <td align="center" style="font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em; color: #968FA7;">
              Teros &middot; &copy; 2026
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
