<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- UI Control: a desktop of tiled windows with one focused -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0A0A0F"/>
  <!-- left window (chat, focused) -->
  <rect x="40" y="56" width="100" height="144" rx="12" fill="#5E6AD2" opacity="0.55"/>
  <rect x="36" y="52" width="108" height="152" rx="14" fill="none" stroke="#A5AFF5" stroke-width="5"/>
  <!-- right top window (terminal) -->
  <rect x="152" y="56" width="64" height="64" rx="10" fill="#23233A"/>
  <rect x="152" y="56" width="64" height="64" rx="10" fill="none" stroke="#4A4A6E" stroke-width="4"/>
  <!-- right bottom window (board) -->
  <rect x="152" y="136" width="64" height="64" rx="10" fill="#23233A"/>
  <rect x="152" y="136" width="64" height="64" rx="10" fill="none" stroke="#4A4A6E" stroke-width="4"/>
  <!-- chat lines in the focused window -->
  <rect x="56" y="76" width="52" height="10" rx="5" fill="#E6E8FF"/>
  <rect x="56" y="96" width="68" height="10" rx="5" fill="#B9C0F0"/>
  <rect x="56" y="116" width="44" height="10" rx="5" fill="#B9C0F0"/>
  <!-- composer -->
  <rect x="56" y="168" width="68" height="16" rx="8" fill="#0A0A0F" opacity="0.55"/>
  <rect x="62" y="171" width="4" height="10" rx="2" fill="#A5AFF5"/>
</svg>
